<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Çakma Uzaktan Yardım HUD</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
        color: #f8fafc;
        user-select: none;
      }
      .hud {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 0 12px;
        border-radius: 999px;
        background: rgba(11, 16, 26, 0.92);
        border: 1px solid rgba(52, 211, 153, 0.45);
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.65);
        cursor: move;
      }
      .hud.paused {
        border-color: rgba(251, 191, 36, 0.55);
      }
      .info {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        flex: 1;
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 999px;
        background: #34d399;
        box-shadow: 0 0 10px rgba(52, 211, 153, 0.85);
        flex-shrink: 0;
      }
      .hud.paused .dot {
        background: #fbbf24;
        box-shadow: 0 0 10px rgba(251, 191, 36, 0.75);
      }
      .text-col {
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .title {
        font-size: 11px;
        font-weight: 700;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .hint {
        font-size: 9px;
        color: rgba(255, 255, 255, 0.55);
        white-space: nowrap;
      }
      .actions {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
      }
      button {
        border: none;
        border-radius: 999px;
        padding: 5px 10px;
        font-size: 10px;
        font-weight: 700;
        cursor: pointer;
        color: #fff;
        transition: opacity 0.12s ease;
      }
      button:hover { opacity: 0.9; }
      #pauseBtn {
        background: rgba(251, 191, 36, 0.22);
        color: #fde68a;
        border: 1px solid rgba(251, 191, 36, 0.45);
      }
      #stopBtn {
        background: #ef4444;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div id="hud" class="hud" data-tauri-drag-region>
      <div class="info" data-tauri-drag-region>
        <span class="dot"></span>
        <div class="text-col" data-tauri-drag-region>
          <span id="titleText" class="title" data-tauri-drag-region>Uzaktan Kontrol Aktif</span>
          <span class="hint" data-tauri-drag-region>Acil Kes: Ctrl+Alt+Esc veya Pause</span>
        </div>
      </div>
      <div class="actions">
        <button id="pauseBtn" type="button">Duraklat</button>
        <button id="stopBtn" type="button">Durdur</button>
      </div>
    </div>
    <script>
      (function () {
        const hud = document.getElementById('hud');
        const titleText = document.getElementById('titleText');
        const pauseBtn = document.getElementById('pauseBtn');
        const stopBtn = document.getElementById('stopBtn');
        let isPaused = false;
        let controllerName = 'Uzaktan Yardımcı';

        function render() {
          if (isPaused) {
            hud.classList.add('paused');
            titleText.textContent = controllerName + ' (Duraklatıldı)';
            pauseBtn.textContent = 'Devam Et';
          } else {
            hud.classList.remove('paused');
            titleText.textContent = controllerName + ' kontrol ediyor';
            pauseBtn.textContent = 'Duraklat';
          }
        }

        function initTauri() {
          const tauri = window.__TAURI__;
          if (!tauri || !tauri.event) {
            setTimeout(initTauri, 80);
            return;
          }

          tauri.event.listen('remote-assist-hud-state', (ev) => {
            const p = ev.payload || {};
            if (typeof p.controllerName === 'string' && p.controllerName) {
              controllerName = p.controllerName;
            }
            if (typeof p.paused === 'boolean') {
              isPaused = p.paused;
            }
            render();
          }).catch(() => {});

          pauseBtn.addEventListener('click', () => {
            isPaused = !isPaused;
            render();
            tauri.event.emit('remote-assist-hud-action', { action: 'toggle_pause', paused: isPaused }).catch(() => {});
          });

          stopBtn.addEventListener('click', () => {
            tauri.event.emit('remote-assist-hud-action', { action: 'stop' }).catch(() => {});
          });
        }

        render();
        initTauri();
      })();
    </script>
  </body>
</html>
