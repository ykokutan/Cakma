<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Çakma Uzaktan Yardım Overlay</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        pointer-events: none;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="overlayCanvas"></canvas>
    <script>
      (function () {
        const canvas = document.getElementById('overlayCanvas');
        const ctx = canvas.getContext('2d');
        const TTL_MS = 4500;
        let laser = null; // { x, y, updatedAt }
        let strokes = []; // [{ tool, color, points, createdAt }]

        function resize() {
          const dpr = window.devicePixelRatio || 1;
          canvas.width = Math.max(1, Math.floor(window.innerWidth * dpr));
          canvas.height = Math.max(1, Math.floor(window.innerHeight * dpr));
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        window.addEventListener('resize', resize);
        resize();

        function drawArrow(x1, y1, x2, y2, color, alpha) {
          const headLen = 16;
          const angle = Math.atan2(y2 - y1, x2 - x1);
          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.strokeStyle = color;
          ctx.fillStyle = color;
          ctx.lineWidth = 4;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(x2, y2);
          ctx.lineTo(x2 - headLen * Math.cos(angle - Math.PI / 6), y2 - headLen * Math.sin(angle - Math.PI / 6));
          ctx.lineTo(x2 - headLen * Math.cos(angle + Math.PI / 6), y2 - headLen * Math.sin(angle + Math.PI / 6));
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        }

        function renderFrame() {
          const now = Date.now();
          const w = window.innerWidth;
          const h = window.innerHeight;
          ctx.clearRect(0, 0, w, h);

          strokes = strokes.filter((s) => now - s.createdAt < TTL_MS);
          for (const s of strokes) {
            const age = now - s.createdAt;
            const alpha = Math.max(0.05, Math.min(1, 1 - Math.max(0, age - 2500) / (TTL_MS - 2500)));
            const pts = s.points || [];
            if (pts.length === 0) continue;

            if (s.tool === 'arrow' && pts.length >= 2) {
              const p0 = pts[0];
              const p1 = pts[pts.length - 1];
              drawArrow(p0.x * w, p0.y * h, p1.x * w, p1.y * h, s.color || '#f43f5e', alpha);
            } else if (s.tool === 'rect' && pts.length >= 2) {
              const p0 = pts[0];
              const p1 = pts[pts.length - 1];
              const rx = Math.min(p0.x, p1.x) * w;
              const ry = Math.min(p0.y, p1.y) * h;
              const rw = Math.abs(p1.x - p0.x) * w;
              const rh = Math.abs(p1.y - p0.y) * h;
              ctx.save();
              ctx.globalAlpha = alpha;
              ctx.strokeStyle = s.color || '#f43f5e';
              ctx.lineWidth = 3.5;
              ctx.strokeRect(rx, ry, rw, rh);
              ctx.restore();
            } else {
              ctx.save();
              ctx.globalAlpha = alpha;
              ctx.strokeStyle = s.color || '#f43f5e';
              ctx.lineWidth = 4;
              ctx.lineCap = 'round';
              ctx.lineJoin = 'round';
              ctx.beginPath();
              ctx.moveTo(pts[0].x * w, pts[0].y * h);
              for (let i = 1; i < pts.length; i++) {
                ctx.lineTo(pts[i].x * w, pts[i].y * h);
              }
              ctx.stroke();
              ctx.restore();
            }
          }

          if (laser && now - laser.updatedAt < 4000) {
            const lx = laser.x * w;
            const ly = laser.y * h;
            const pulse = 14 + Math.sin(now / 110) * 4;
            ctx.save();
            ctx.beginPath();
            ctx.arc(lx, ly, pulse, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(244, 63, 94, 0.25)';
            ctx.fill();
            ctx.beginPath();
            ctx.arc(lx, ly, 7, 0, Math.PI * 2);
            ctx.fillStyle = '#f43f5e';
            ctx.fill();
            ctx.lineWidth = 2.5;
            ctx.strokeStyle = '#ffffff';
            ctx.stroke();
            ctx.restore();
          }

          requestAnimationFrame(renderFrame);
        }
        requestAnimationFrame(renderFrame);

        function initTauri() {
          const tauri = window.__TAURI__;
          if (!tauri || !tauri.event) {
            setTimeout(initTauri, 80);
            return;
          }

          tauri.event.listen('remote-assist-overlay-event', (ev) => {
            const data = ev.payload || {};
            if (data.type === 'laser') {
              if (data.active) {
                laser = { x: Number(data.x) || 0, y: Number(data.y) || 0, updatedAt: Date.now() };
              } else {
                laser = null;
              }
            } else if (data.type === 'stroke' && data.stroke) {
              strokes.push({ ...data.stroke, createdAt: Date.now() });
            } else if (data.type === 'clear') {
              strokes = [];
            }
          }).catch(() => {});
        }
        initTauri();
      })();
    </script>
  </body>
</html>
