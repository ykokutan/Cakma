<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Çakma Overlay</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
        color: #f8fafc;
        user-select: none;
      }
      .shell {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        background: rgba(11, 13, 20, 0.78);
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 14px;
        overflow: hidden;
        transition: background 0.15s ease, border-color 0.15s ease;
      }
      .shell.interactive {
        border-color: rgba(34, 211, 238, 0.55);
        box-shadow: 0 0 0 1px rgba(34, 211, 238, 0.25) inset;
      }
      .shell.compact .header { padding: 6px 8px; }
      .shell.compact .body { padding: 6px; gap: 4px; }
      .shell.compact .speaker { padding: 4px 6px; }
      .shell.compact .name { font-size: 11px; }
      .shell.compact .footer { padding: 5px 8px; }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 8px 10px;
        background: rgba(255, 255, 255, 0.06);
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        cursor: move;
        flex-shrink: 0;
      }
      .title-wrap {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
        flex: 1;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: #34d399;
        box-shadow: 0 0 8px rgba(52, 211, 153, 0.7);
        flex-shrink: 0;
      }
      .dot.idle { background: #64748b; box-shadow: none; }
      .title {
        font-size: 11px;
        font-weight: 700;
        text-shadow: 0 1px 2px rgba(0,0,0,0.6);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .header-actions {
        display: flex;
        align-items: center;
        gap: 5px;
        flex-shrink: 0;
      }
      .ping {
        font-size: 10px;
        font-family: ui-monospace, monospace;
        padding: 2px 6px;
        border-radius: 6px;
        background: rgba(16, 185, 129, 0.18);
        color: #6ee7b7;
        border: 1px solid rgba(16, 185, 129, 0.35);
        display: none;
      }
      .mode-pill {
        font-size: 9px;
        font-weight: 700;
        padding: 2px 5px;
        border-radius: 5px;
        background: rgba(34, 211, 238, 0.2);
        color: #67e8f9;
        border: 1px solid rgba(34, 211, 238, 0.4);
        display: none;
      }
      .shell.interactive .mode-pill { display: inline-block; }
      .count {
        font-size: 10px;
        font-family: ui-monospace, monospace;
        color: rgba(255, 255, 255, 0.6);
        padding: 0 2px;
      }
      .icon-btn {
        border: none;
        background: rgba(255, 255, 255, 0.08);
        color: rgba(255, 255, 255, 0.78);
        width: 22px;
        height: 22px;
        border-radius: 6px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        transition: background 0.15s, color 0.15s;
      }
      .icon-btn:hover { background: rgba(255, 255, 255, 0.18); color: #fff; }
      .icon-btn.locked { background: rgba(245, 158, 11, 0.28); color: #fcd34d; }

      .tab-bar {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 5px 8px;
        background: rgba(0, 0, 0, 0.24);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        flex-shrink: 0;
      }
      .shell.compact .tab-bar { display: none; }
      .tab-btn {
        flex: 1;
        border: none;
        background: transparent;
        color: rgba(255, 255, 255, 0.6);
        font-size: 10px;
        font-weight: 600;
        padding: 4px 6px;
        border-radius: 7px;
        cursor: pointer;
        transition: background 0.15s, color 0.15s;
      }
      .tab-btn:hover { background: rgba(255, 255, 255, 0.08); color: #fff; }
      .tab-btn.active {
        background: rgba(59, 130, 246, 0.26);
        color: #93c5fd;
        border: 1px solid rgba(59, 130, 246, 0.4);
      }

      .body {
        flex: 1;
        overflow-y: auto;
        padding: 8px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .empty {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-size: 11px;
        color: rgba(255, 255, 255, 0.55);
        text-shadow: 0 1px 2px rgba(0,0,0,0.6);
        padding: 12px;
        gap: 6px;
      }
      .speaker {
        display: flex;
        flex-direction: column;
        gap: 5px;
        padding: 6px 8px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.09);
        transition: all 0.15s ease;
      }
      .speaker.speaking {
        background: rgba(16, 185, 129, 0.22);
        border-color: rgba(52, 211, 153, 0.7);
        box-shadow: 0 0 12px rgba(16, 185, 129, 0.25);
      }
      .sp-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .sp-left {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }
      .avatar {
        width: 22px;
        height: 22px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        overflow: hidden;
        flex-shrink: 0;
      }
      .avatar img { width: 100%; height: 100%; object-fit: cover; }
      .speaker.speaking .avatar { box-shadow: 0 0 0 2px #34d399; }
      .name {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.92);
        text-shadow: 0 1px 2px rgba(0,0,0,0.65);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .speaker.speaking .name { font-weight: 700; color: #6ee7b7; }
      .sp-right {
        font-size: 11px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .vol-wrap {
        display: none;
        align-items: center;
        gap: 6px;
        font-size: 10px;
        color: rgba(255, 255, 255, 0.65);
      }
      .shell.interactive .vol-wrap { display: flex; }
      .vol-wrap input[type="range"] {
        flex: 1;
        height: 4px;
        accent-color: #38bdf8;
      }

      .room-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 7px 9px;
        border-radius: 9px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.09);
        color: #f8fafc;
        font-size: 11px;
        cursor: pointer;
        text-align: left;
        transition: background 0.15s;
      }
      .room-item:hover { background: rgba(255, 255, 255, 0.14); }
      .room-item.current {
        background: rgba(16, 185, 129, 0.22);
        border-color: rgba(52, 211, 153, 0.5);
        font-weight: 700;
      }

      .chat-list {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 5px;
        overflow-y: auto;
      }
      .chat-msg {
        font-size: 11px;
        line-height: 1.35;
        padding: 5px 7px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.05);
        word-break: break-word;
      }
      .chat-author { color: #7dd3fc; font-weight: 700; margin-right: 5px; }
      .chat-form {
        display: flex;
        gap: 5px;
        padding-top: 4px;
        flex-shrink: 0;
      }
      .chat-input {
        flex: 1;
        min-width: 0;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: rgba(0, 0, 0, 0.45);
        color: #fff;
        font-size: 11px;
        padding: 5px 8px;
        border-radius: 7px;
        outline: none;
      }
      .chat-input:focus { border-color: #38bdf8; }

      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 7px 10px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.04);
        flex-shrink: 0;
      }
      .footer-label { font-size: 10px; color: rgba(255, 255, 255, 0.5); }
      .footer-btns { display: flex; align-items: center; gap: 5px; }
      .ctrl-btn {
        border: none;
        padding: 4px 8px;
        border-radius: 7px;
        font-size: 10px;
        font-weight: 600;
        cursor: pointer;
        background: rgba(255, 255, 255, 0.12);
        color: #f8fafc;
        transition: background 0.15s;
      }
      .ctrl-btn:hover { background: rgba(255, 255, 255, 0.22); }
      .ctrl-btn.danger { background: rgba(244, 63, 94, 0.32); color: #fda4af; }
    </style>
  </head>
  <body>
    <div id="shell" class="shell">
      <div class="header" data-tauri-drag-region>
        <div class="title-wrap" data-tauri-drag-region>
          <span id="dot" class="dot idle" data-tauri-drag-region></span>
          <span id="channelTitle" class="title" data-tauri-drag-region>Çakma Overlay</span>
        </div>
        <div class="header-actions">
          <span id="modePill" class="mode-pill">ETKİLEŞİM</span>
          <span id="pingBadge" class="ping"></span>
          <span id="speakerCount" class="count">0</span>
          <button id="lockBtn" class="icon-btn" title="Tıklama Geçirgenliği (Ctrl+Shift+O)">🔓</button>
          <button id="closeBtn" class="icon-btn" title="Overlay'i Kapat">✕</button>
        </div>
      </div>

      <div class="tab-bar">
        <button id="tabSpeakers" class="tab-btn active" type="button">🎙️ Konuşanlar</button>
        <button id="tabRooms" class="tab-btn" type="button">🔊 Odalar</button>
        <button id="tabChat" class="tab-btn" type="button">💬 Sohbet</button>
      </div>

      <div id="speakersBody" class="body">
        <div class="empty">
          <div style="font-size:18px;">🎙️</div>
          <div>Ses odasına katıldığınızda konuşanlar burada görünür.</div>
        </div>
      </div>

      <div id="footerBar" class="footer">
        <span class="footer-label" id="hotkeyHint">Alt+Shift+O</span>
        <div class="footer-btns">
          <button id="muteBtn" class="ctrl-btn">🎤</button>
          <button id="deafenBtn" class="ctrl-btn">🎧</button>
          <button id="leaveBtn" class="ctrl-btn danger" style="display:none;" title="Odadan Ayrıl">📞</button>
        </div>
      </div>
    </div>

    <script>
      (function () {
        const shell = document.getElementById('shell');
        const dot = document.getElementById('dot');
        const channelTitle = document.getElementById('channelTitle');
        const pingBadge = document.getElementById('pingBadge');
        const speakerCount = document.getElementById('speakerCount');
        const speakersBody = document.getElementById('speakersBody');
        const footerBar = document.getElementById('footerBar');
        const lockBtn = document.getElementById('lockBtn');
        const closeBtn = document.getElementById('closeBtn');
        const muteBtn = document.getElementById('muteBtn');
        const deafenBtn = document.getElementById('deafenBtn');
        const leaveBtn = document.getElementById('leaveBtn');
        const tabSpeakers = document.getElementById('tabSpeakers');
        const tabRooms = document.getElementById('tabRooms');
        const tabChat = document.getElementById('tabChat');

        let isLocked = localStorage.getItem('dc_overlay_locked') === '1';
        let isInteractive = false;
        let activeTab = 'speakers';
        let lastPayload = null;
        let tauriRef = null;
        let overlayCfg = {
          onlySpeaking: false,
          showControls: true,
          showPing: true,
          size: 'standard',
        };
        try {
          const savedCfg = JSON.parse(localStorage.getItem('dc_overlay_config') || 'null');
          if (savedCfg && typeof savedCfg === 'object') {
            overlayCfg = { ...overlayCfg, ...savedCfg };
          }
        } catch {}

        function applyOpacity(val) {
          const num = Number(val);
          const clamped = Number.isFinite(num) ? Math.min(100, Math.max(15, num)) : 75;
          const bgAlpha = (clamped / 100) * 0.92;
          const borderAlpha = Math.max(0.08, (clamped / 100) * 0.22);
          shell.style.background = `rgba(11, 13, 20, ${bgAlpha.toFixed(2)})`;
          if (!isInteractive) {
            shell.style.borderColor = `rgba(255, 255, 255, ${borderAlpha.toFixed(2)})`;
          }
        }

        function setTab(nextTab) {
          activeTab = nextTab;
          tabSpeakers.classList.toggle('active', nextTab === 'speakers');
          tabRooms.classList.toggle('active', nextTab === 'rooms');
          tabChat.classList.toggle('active', nextTab === 'chat');
          if (lastPayload) renderState(lastPayload);
        }

        tabSpeakers.addEventListener('click', () => setTab('speakers'));
        tabRooms.addEventListener('click', () => setTab('rooms'));
        tabChat.addEventListener('click', () => setTab('chat'));

        function applyConfig(cfg) {
          if (cfg && typeof cfg === 'object') {
            overlayCfg = { ...overlayCfg, ...cfg };
          }
          footerBar.style.display = overlayCfg.showControls ? 'flex' : 'none';
          shell.classList.toggle('compact', overlayCfg.size === 'compact');
          if (lastPayload) renderState(lastPayload);
        }

        function applyLockUi(locked) {
          isLocked = Boolean(locked);
          lockBtn.textContent = isLocked ? '🔒' : '🔓';
          lockBtn.classList.toggle('locked', isLocked);
        }

        function applyInteractiveUi(active) {
          isInteractive = Boolean(active);
          shell.classList.toggle('interactive', isInteractive);
          if (isInteractive && overlayCfg.size === 'compact') {
            shell.classList.remove('compact');
          }
          if (tauriRef && tauriRef.core) {
            const dims = isInteractive ? { width: 340, height: 380 } : getSizeDims(overlayCfg.size);
            tauriRef.core.invoke('resize_overlay_window', dims).catch(() => {});
          }
        }

        function renderState(payload) {
          lastPayload = payload;
          const allSpeakers = Array.isArray(payload?.speakers) ? payload.speakers : [];
          const speakers = overlayCfg.onlySpeaking
            ? allSpeakers.filter((s) => s.isSpeaking)
            : allSpeakers;
          const voiceChannels = Array.isArray(payload?.voiceChannels) ? payload.voiceChannels : [];
          const recentMessages = Array.isArray(payload?.recentMessages) ? payload.recentMessages : [];
          const inVoice = Boolean(payload?.inVoice);
          const chId = payload?.channelId || '';
          const chName = payload?.channelName || '';
          const ping = Number(payload?.ping || 0);
          const isMuted = Boolean(payload?.isMuted);
          const isDeafened = Boolean(payload?.isDeafened);

          channelTitle.textContent = inVoice && chName ? chName : 'Çakma Overlay';
          dot.classList.toggle('idle', !inVoice);
          speakerCount.textContent = String(allSpeakers.length);
          leaveBtn.style.display = inVoice ? 'inline-block' : 'none';

          if (overlayCfg.showPing && inVoice) {
            pingBadge.style.display = 'inline-block';
            pingBadge.textContent = ping > 0 ? ping + 'ms' : '...ms';
          } else {
            pingBadge.style.display = 'none';
          }

          muteBtn.textContent = isMuted ? '🔇' : '🎤';
          muteBtn.classList.toggle('danger', isMuted);
          deafenBtn.classList.toggle('danger', isDeafened);

          if (activeTab === 'rooms') {
            speakersBody.innerHTML = '';
            if (voiceChannels.length === 0) {
              speakersBody.innerHTML = '<div class="empty"><div>Aktif ses odası bulunamadı.</div></div>';
              return;
            }
            for (const vc of voiceChannels) {
              const btn = document.createElement('button');
              btn.type = 'button';
              btn.className = 'room-item' + (vc.id === chId ? ' current' : '');
              const left = document.createElement('span');
              left.textContent = '🔊 ' + (vc.name || 'Ses Odası');
              const right = document.createElement('span');
              right.textContent = String(vc.userCount || 0) + ' kişi';
              right.style.opacity = '0.7';
              btn.appendChild(left);
              btn.appendChild(right);
              btn.addEventListener('click', () => {
                if (tauriRef?.event) {
                  tauriRef.event.emit('overlay-switch-voice-channel', { channelId: vc.id }).catch(() => {});
                }
              });
              speakersBody.appendChild(btn);
            }
            return;
          }

          if (activeTab === 'chat') {
            speakersBody.innerHTML = '';
            const list = document.createElement('div');
            list.className = 'chat-list';
            if (recentMessages.length === 0) {
              list.innerHTML = '<div class="empty"><div>Bu kanalda henüz mesaj yok.</div></div>';
            } else {
              for (const m of recentMessages) {
                const div = document.createElement('div');
                div.className = 'chat-msg';
                const au = document.createElement('span');
                au.className = 'chat-author';
                au.textContent = (m.author || 'Kullanıcı') + ':';
                const tx = document.createElement('span');
                tx.textContent = m.content || '';
                div.appendChild(au);
                div.appendChild(tx);
                list.appendChild(div);
              }
            }
            const form = document.createElement('form');
            form.className = 'chat-form';
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'chat-input';
            input.placeholder = '#' + (payload?.activeChatName || 'sohbet') + ' kanalına yaz...';
            const sendBtn = document.createElement('button');
            sendBtn.type = 'submit';
            sendBtn.className = 'ctrl-btn';
            sendBtn.textContent = 'Gönder';
            form.appendChild(input);
            form.appendChild(sendBtn);
            form.addEventListener('submit', (ev) => {
              ev.preventDefault();
              const txt = input.value.trim();
              if (!txt || !tauriRef?.event) return;
              tauriRef.event.emit('overlay-send-chat', { text: txt }).catch(() => {});
              input.value = '';
            });
            speakersBody.appendChild(list);
            speakersBody.appendChild(form);
            list.scrollTop = list.scrollHeight;
            return;
          }

          if (!inVoice) {
            speakersBody.innerHTML =
              '<div class="empty"><div style="font-size:18px;">🎙️</div><div>Ses odasına katıldığınızda konuşanlar burada görünür.</div></div>';
            return;
          }

          if (speakers.length === 0) {
            speakersBody.innerHTML =
              '<div class="empty"><div>' +
              (overlayCfg.onlySpeaking ? 'Şu anda konuşan kimse yok.' : 'Odada kimse yok.') +
              '</div></div>';
            return;
          }

          speakersBody.innerHTML = '';
          for (const s of speakers) {
            const row = document.createElement('div');
            row.className = 'speaker' + (s.isSpeaking ? ' speaking' : '');

            const spRow = document.createElement('div');
            spRow.className = 'sp-row';

            const left = document.createElement('div');
            left.className = 'sp-left';

            const av = document.createElement('div');
            av.className = 'avatar';
            const avVal = String(s.avatar || '👤');
            if (avVal.startsWith('data:image/') || avVal.startsWith('http://') || avVal.startsWith('https://')) {
              const img = document.createElement('img');
              img.src = avVal;
              av.appendChild(img);
            } else {
              av.textContent = avVal;
            }

            const name = document.createElement('span');
            name.className = 'name';
            name.textContent = s.username || 'Kullanıcı';

            left.appendChild(av);
            left.appendChild(name);

            const right = document.createElement('div');
            right.className = 'sp-right';
            let statusIcons = '';
            if (s.isHandRaised) statusIcons += '✋ ';
            if (s.isDeafened) statusIcons += '🔇';
            else if (s.isMuted) statusIcons += '🚫';
            else statusIcons += s.isSpeaking ? '🔊' : '🎤';
            right.textContent = statusIcons;

            spRow.appendChild(left);
            spRow.appendChild(right);
            row.appendChild(spRow);

            const volWrap = document.createElement('div');
            volWrap.className = 'vol-wrap';
            const volLabel = document.createElement('span');
            const initialVol = Number.isFinite(Number(s.volume)) ? Number(s.volume) : 100;
            volLabel.textContent = '%' + initialVol;
            const slider = document.createElement('input');
            slider.type = 'range';
            slider.min = '0';
            slider.max = '200';
            slider.value = String(initialVol);
            slider.addEventListener('input', (ev) => {
              const val = Number(ev.target.value);
              volLabel.textContent = '%' + val;
              if (tauriRef?.event && s.id) {
                tauriRef.event.emit('overlay-set-user-volume', { userId: s.id, volume: val }).catch(() => {});
              }
            });
            volWrap.appendChild(slider);
            volWrap.appendChild(volLabel);
            row.appendChild(volWrap);

            speakersBody.appendChild(row);
          }
        }

        applyOpacity(localStorage.getItem('dc_overlay_opacity') || '75');
        applyConfig(overlayCfg);
        applyLockUi(isLocked);

        window.addEventListener('storage', (e) => {
          if (e.key === 'dc_overlay_opacity') applyOpacity(e.newValue);
          if (e.key === 'dc_overlay_config') {
            try { applyConfig(JSON.parse(e.newValue || '{}')); } catch {}
          }
        });

        function getSizeDims(sz) {
          if (sz === 'compact') return { width: 240, height: 200 };
          if (sz === 'wide') return { width: 350, height: 340 };
          return { width: 300, height: 290 };
        }

        function initTauri() {
          const tauri = window.__TAURI__;
          if (!tauri || !tauri.event || !tauri.core) {
            setTimeout(initTauri, 100);
            return;
          }
          tauriRef = tauri;

          const dims = getSizeDims(overlayCfg.size);
          tauri.core.invoke('resize_overlay_window', dims).catch(() => {});
          const corner = localStorage.getItem('dc_overlay_corner') || 'top-left';
          tauri.core.invoke('position_overlay_window', { corner }).catch(() => {});
          if (isLocked) {
            tauri.core.invoke('set_overlay_ignore_cursor', { ignore: true }).catch(() => {});
          }

          tauri.event.listen('overlay-speakers-update', (ev) => renderState(ev.payload)).catch(() => {});
          tauri.event.listen('overlay-opacity-changed', (ev) => applyOpacity(ev.payload)).catch(() => {});
          tauri.event.listen('overlay-lock-changed', (ev) => applyLockUi(ev.payload)).catch(() => {});
          tauri.event.listen('overlay-interactive-changed', (ev) => applyInteractiveUi(ev.payload)).catch(() => {});
          tauri.event.listen('overlay-config-changed', (ev) => {
            applyConfig(ev.payload);
            const nextDims = getSizeDims(overlayCfg.size);
            tauri.core.invoke('resize_overlay_window', nextDims).catch(() => {});
          }).catch(() => {});
          tauri.event.emit('overlay-ready').catch(() => {});

          lockBtn.addEventListener('click', () => {
            const next = !isLocked;
            applyLockUi(next);
            try { localStorage.setItem('dc_overlay_locked', next ? '1' : '0'); } catch {}
            tauri.core.invoke('set_overlay_ignore_cursor', { ignore: next }).catch(() => {});
          });

          closeBtn.addEventListener('click', () => {
            tauri.event.emit('overlay-close-requested').catch(() => {});
          });
          muteBtn.addEventListener('click', () => {
            tauri.event.emit('overlay-toggle-mute').catch(() => {});
          });
          deafenBtn.addEventListener('click', () => {
            tauri.event.emit('overlay-toggle-deafen').catch(() => {});
          });
          leaveBtn.addEventListener('click', () => {
            tauri.event.emit('overlay-leave-voice').catch(() => {});
          });
        }

        initTauri();
      })();
    </script>
  </body>
</html>
