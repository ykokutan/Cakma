name: Build macOS Desktop (Universal DMG)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Setup Rust & Apple Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install Client Dependencies
        working-directory: client
        run: npm ci

      - name: Build Tauri macOS Universal (.dmg & .app)
        working-directory: client
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --target universal-apple-darwin --bundles dmg,app

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cakma-macOS-Universal
          path: |
            client/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            client/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.tar.gz
