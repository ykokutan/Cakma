name: CI Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install Workspace Lint Dependencies
        run: npm ci
      - name: Run Workspace ESLint
        run: npm run lint

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install Server Dependencies
        working-directory: server
        run: npm ci
      - name: Build & Run Server Tests
        working-directory: server
        run: npm test
      - name: Security Audit (Server Prod Deps)
        working-directory: server
        run: npm audit --omit=dev --audit-level=high

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install Client Dependencies
        working-directory: client
        run: npm ci
      - name: Run Client Unit Tests
        working-directory: client
        run: npm test
      - name: TypeScript & Vite Production Build
        working-directory: client
        run: npm run build
      - name: Security Audit (Client Prod Deps)
        working-directory: client
        run: npm audit --omit=dev --audit-level=high

  dedicated-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dedicated-server/package-lock.json
      - name: Install Dedicated Server Dependencies
        working-directory: dedicated-server
        run: npm ci
      - name: Build & Run Dedicated Server Tests
        working-directory: dedicated-server
        run: npm test
      - name: Security Audit (Dedicated Server Prod Deps)
        working-directory: dedicated-server
        run: npm audit --omit=dev --audit-level=high

  tauri-rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Prepare Minimal Dist Placeholder for Rust Tests
        shell: bash
        run: mkdir -p client/dist && echo "<html></html>" > client/dist/index.html
      - name: Check Rust Formatting
        working-directory: client/src-tauri
        run: cargo fmt --check
      - name: Run Clippy (-D warnings)
        working-directory: client/src-tauri
        run: cargo clippy -- -D warnings
      - name: Run Rust Unit Tests
        working-directory: client/src-tauri
        run: cargo test

  e2e:
    runs-on: ubuntu-latest
    needs: [server, client]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json
      - name: Install Workspace, Server & Client Dependencies
        run: |
          npm ci
          npm --prefix server ci
          npm --prefix client ci
      - name: Build Server & Client
        run: |
          npm --prefix server run build
          npm --prefix client run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Playwright E2E Tests
        run: npm run test:e2e
