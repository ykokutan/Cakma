name: Multi-Platform Release (Win, macOS, Linux, Android, iOS)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      windows:
        description: "Build Windows NSIS Installer"
        type: boolean
        default: true
      macos:
        description: "Build macOS Universal DMG"
        type: boolean
        default: true
      linux:
        description: "Build Linux AppImage & DEB"
        type: boolean
        default: true
      android:
        description: "Build Android APK"
        type: boolean
        default: true
      ios:
        description: "Build iOS Simulator Bundle"
        type: boolean
        default: true

jobs:
  windows:
    if: ${{ github.event_name == 'push' || inputs.windows }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri
      - name: Install Client Dependencies
        working-directory: client
        run: npm ci
      - name: Build Tauri Windows NSIS Installer
        working-directory: client
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            npx tauri build --bundles nsis
          else
            echo "TAURI_SIGNING_PRIVATE_KEY is not set; building unsigned NSIS installer."
            npx tauri build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi
      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cakma-Windows-x64
          if-no-files-found: warn
          path: |
            client/src-tauri/target/release/bundle/nsis/*.exe
            client/src-tauri/target/release/bundle/nsis/*.sig

  macos:
    if: ${{ github.event_name == 'push' || inputs.macos }}
    uses: ./.github/workflows/release-macos.yml
    with:
      target: universal-apple-darwin
    secrets: inherit

  linux:
    if: ${{ github.event_name == 'push' || inputs.linux }}
    uses: ./.github/workflows/release-linux.yml
    secrets: inherit

  android:
    if: ${{ github.event_name == 'push' || inputs.android }}
    uses: ./.github/workflows/build-android.yml
    with:
      build_mode: release
      target_arch: aarch64
      bundle_format: apk
    secrets: inherit

  ios:
    if: ${{ github.event_name == 'push' || inputs.ios }}
    uses: ./.github/workflows/build-ios.yml
    with:
      build_mode: simulator
    secrets: inherit

  publish-release:
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') && (needs.windows.result == 'success' || needs.macos.result == 'success' || needs.linux.result == 'success' || needs.android.result == 'success' || needs.ios.result == 'success') }}
    needs: [windows, macos, linux, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download All Built Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: false
      - name: Publish GitHub Release Assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-artifacts/**/*
