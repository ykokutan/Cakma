name: Build Android APK (Tauri 2)

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "Android build target (debug or release)"
        required: false
        default: "debug"

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK 27
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Setup Rust & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install Client Dependencies
        working-directory: client
        run: npm ci

      - name: Initialize Tauri Android Project (if absent)
        working-directory: client
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            npx tauri android init --ci
          fi

      - name: Build Android APK
        working-directory: client
        run: |
          if [ "${{ github.event.inputs.build_mode }}" = "release" ]; then
            npx tauri android build --apk --target aarch64
          else
            npx tauri android build --apk --debug --target aarch64
          fi

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cakma-Android-APK
          path: client/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
